# SPDX-License-Identifier: MPL-2.0
#
# Gitleaks configuration — metadatastician/cerro-torre
#
# EXTENDS THE ESTATE BASELINE, it does not replace it.
# `.gitleaks-estate.toml` is staged into the workspace root by
# hyperpolymath/standards `.github/workflows/secret-scanner-reusable.yml`
# before the scan runs. gitleaks resolves `[extend] path` against the process
# CWD (verified — NOT relative to this file), which is the repository root.
# This file therefore REQUIRES a reusable pin at or after `bd914b34`; on an
# older pin nothing stages the baseline and gitleaks exits FTL.
#
# WHY THIS FILE IS LOCAL RATHER THAN IN THE ESTATE BASELINE.
# Every entry below is a blind spot. Held here, it blinds this repository only,
# and the justification sits beside the code it describes. Promoted to the
# estate baseline it would blind all 400+ repositories.
#
# Each entry names WHAT THE VALUE IS. "This file is noisy" is not a reason.
#
# VALUE ENTRIES ARE PREFERRED OVER PATH ENTRIES, and both are used below.
# A `regexes` entry suppresses exactly one string, so a credential planted in
# the same file is STILL caught. A `paths` entry blinds the whole file. The
# estate baseline's own comment claims anchored value regexes are "silently
# INERT" for `generic-api-key` — MEASURED FALSE on the pinned gitleaks 8.18.4
# (2026-09-04): with `regexTarget` unset, one anchored value regex took this
# repository from 19 findings to 12. Paths are used below only where the
# value's SHAPE is genuinely indistinguishable from a live credential.
#
# Every finding suppressed here was triaged on 2026-09-04 by reading the
# matched line with the value redacted: 19 findings, 19 false positives, 0
# credentials. Before adding an entry, plant a realistic secret in the same
# path and confirm it is STILL detected.

[extend]
path = ".gitleaks-estate.toml"

[allowlist]
description = "metadatastician/cerro-torre: locally justified exemptions, extending the estate baseline"

regexes = [
  # Ada and Idris TYPE NAMES, not values. `generic-api-key` cannot distinguish
  # an Ada declaration `Key : Ed25519_Private_Key;` from `api_key: <base64>`:
  # it finds a key-ish identifier beside an assignment-ish operator and scores
  # the right-hand side by entropy, and a mixed-case underscore identifier
  # scores ~3.9 bits/char. 12 of the 19 findings are 4 such type names, in
  # `src/core/ct_pqcrypto.{ads,adb}`, `src/core/cerro_crypto_openssl.{ads,adb}`,
  # `src/cli/cerro_cli*.adb`, `src/build/cerro_pack.adb`.
  #
  # The estate baseline already carries the CamelCase form
  # `^(Ed25519|X25519|Curve25519|RSA|ECDSA|EdDSA|Secp256k1)[A-Za-z]*$`, which is
  # what suppresses the Idris `Ed25519PrivateKey`. Its character class has no
  # `_`, so it cannot match Ada snake_case; this entry covers that, and adds the
  # NIST PQC families this repository actually uses.
  '''^(Ed25519|X25519|Curve25519|ML_DSA|ML_KEM|SLH_DSA)(_[A-Za-z0-9]+)*_(Private|Secret|Public)_Key$''',

  # A GPG long key ID in `manifests/hello.ctp.example`. A key ID is the public
  # fingerprint of a public key — it is published in order to be quoted.
  '''^0x[0-9A-Fa-f]{16}$''',

  # The `key_id` of a REVOKED key in the `denied` list of
  # `examples/policy-enterprise.json`, citing a fictional "security incident
  # #1234". The value exists so the example can demonstrate denial; it names a
  # key that must never be honoured.
  '''^compromised-key-2024$''',
]

paths = [
  # PATH ENTRIES — WHOLE-FILE BLIND SPOTS. Both files below carry Rekor
  # transparency-log entry hashes: 64 lowercase hex characters, public by
  # construction (a transparency log is published so it can be audited).
  #
  # These cannot be exempted by value. 64-lowercase-hex is byte-for-byte the
  # same shape as a hex-encoded 32-byte Ed25519 private key, so a value regex
  # would blind every hex-encoded private key in the repository — strictly worse
  # than blinding these two files. Scoping a regex to a path (`[[allowlists]]`
  # with `condition = "AND"`) would fix this, but it is SILENTLY IGNORED on the
  # pinned gitleaks 8.18.4 — measured, no parse error and no warning — so it is
  # unavailable until the estate moves to 8.19+. Revisit then.
  #
  # Confirmed by plant test 2026-09-04: a realistic credential planted in either
  # file is NOT detected. Everything else in the repository still is.

  # Worked example trust store: 4 Rekor entry hashes in
  # `@attestation(rekor="...")`, plus an `ssh-ed25519` PUBLIC key whose body
  # reads `...BackupKeyDataExampleForProductionUse`, owners at `@example.com`.
  '''(^|/)examples/policies/trust-store-2026\.a2ml$''',

  # Dated key-generation progress notes: a Rekor entry hash and a value
  # explicitly labelled `Public key:`. Pattern matches future dated files of the
  # same series, which are generated by the same process.
  '''(^|/)KEYGEN-PROGRESS-[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$''',
]
