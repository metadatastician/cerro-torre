# Calls the estate's shared secret scanner (gitleaks + rust-secrets +
# shell-secrets). The reusable requires only contents: read and no secrets.
name: "Secret Scanner"
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  scan:
    uses: metadatastician/standards/.github/workflows/secret-scanner-reusable.yml@b8f60511e76c9015d86990317162dce653c92fe1
